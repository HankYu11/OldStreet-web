name: Deploy

# Every PR to main: build, then deploy a temporary Firebase preview channel and comment its URL.
# Pushes to main: deploy oldstreet.handyla.co (live channel).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
      pull-requests: write
    env:
      # Deploy steps are skipped (build still runs) until the secret is configured.
      HAS_FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Deploy PR preview
        uses: FirebaseExtended/action-hosting-deploy@v0
        if: github.event_name == 'pull_request' && env.HAS_FIREBASE_SA == 'true'
        env:
          SITE_URL: https://oldstreet.handyla.co
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          expires: 7d
          projectId: freshtogo-e52a1
          target: prod
      - name: Deploy live
        uses: FirebaseExtended/action-hosting-deploy@v0
        if: github.event_name != 'pull_request' && env.HAS_FIREBASE_SA == 'true'
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: freshtogo-e52a1
          target: prod
