name: Deploy

# Every PR to main: build, then deploy a temporary Firebase preview channel and comment its URL.
# Pushes to main: deploy oldstreet.handyla.co (live channel).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
      pull-requests: write
    env:
      # `firebase init hosting:github` names the secret FIREBASE_SERVICE_ACCOUNT_<PROJECT>; accept either.
      # Deploy steps are skipped (build still runs) until one of them is configured.
      FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT || secrets.FIREBASE_SERVICE_ACCOUNT_FRESHTOGO_E52A1 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # First deploy creates the Hosting site, so no local Firebase CLI setup is needed.
      - name: Ensure Hosting site exists
        if: env.FIREBASE_SA != ''
        run: |
          printf '%s' "$FIREBASE_SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx -y firebase-tools@15 hosting:sites:get oldstreet-web --project freshtogo-e52a1 >/dev/null 2>&1 \
            || npx -y firebase-tools@15 hosting:sites:create oldstreet-web --project freshtogo-e52a1
          rm -f "$RUNNER_TEMP/sa.json"
      - name: Deploy PR preview
        uses: FirebaseExtended/action-hosting-deploy@v0
        if: github.event_name == 'pull_request' && env.FIREBASE_SA != ''
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ env.FIREBASE_SA }}
          expires: 7d
          projectId: freshtogo-e52a1
          target: prod
      - name: Deploy live
        uses: FirebaseExtended/action-hosting-deploy@v0
        if: github.event_name != 'pull_request' && env.FIREBASE_SA != ''
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ env.FIREBASE_SA }}
          channelId: live
          projectId: freshtogo-e52a1
          target: prod
